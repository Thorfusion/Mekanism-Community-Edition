import com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.4'
}

defaultTasks 'fullBuild'

def baseModVersion = mod_version
def buildVersion = System.getenv('BUILD_VER')
if (buildVersion) {
    mod_version = "${baseModVersion}-${buildVersion}"
}

group = 'mekanism'
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = 'Mekanism-Community-Edition'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'GTNH Maven'
        url = uri('https://nexus.gtnewhorizons.com/repository/public/')
        content {
            includeGroup 'com.gtnewhorizons'
            includeGroupByRegex 'com\\.gtnewhorizons\\..+'
        }
    }

    maven {
        name = 'Amadornes Maven'
        url = uri('https://maven.amadornes.com/')
        content { includeGroup 'MCMultiPart2' }
    }
    maven {
        name = 'JEI Maven'
        url = uri('https://dvs1.progwml6.com/files/maven/')
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'BlameJared Maven'
        url = uri('https://maven.blamejared.com/')
        content {
            includeGroup 'CraftTweaker2'
            includeGroup 'net.darkhax.tesla'
        }
    }
    maven {
        name = 'CIL Maven'
        url = uri('https://maven.cil.li/')
        content {
            includeGroup 'li.cil.oc'
            includeGroup 'mcp.mobius.waila'
        }
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = 'BuildCraft Maven'
        url = uri('https://mod-buildcraft.com/maven/')
        content { includeGroup 'com.mod-buildcraft' }
    }
    maven {
        name = 'tterrag Maven'
        url = uri('https://maven.tterrag.com/')
        content { includeGroup 'team.chisel.ctm' }
    }
    maven {
        name = 'IC2 Maven'
        url = uri('https://maven.ic2.player.to/')
        content { includeGroup 'net.industrial-craft' }
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = 'Thiakil Maven'
        url = uri('https://maven.thiakil.com/')
        content { includeGroup 'dan200.computercraft' }
    }
    maven {
        name = 'ModMaven'
        url = uri('https://modmaven.dev/')
        content { includeGroup 'mcjty.theoneprobe' }
    }

    // Narrow legacy fallback for artifacts that disappeared with their
    // original repository. This is deliberately not a general Maven proxy.
    maven {
        name = 'Thorfusion Legacy Fallback'
        url = uri('https://maven.thorfusion.com/artifactory/central/')
        content { includeGroup 'net.darkhax.tesla' }
    }

    // Keep the hosted project repositories available for Mekanism artifacts,
    // without using them as general dependency proxies.
    maven {
        name = 'Thorfusion Releases'
        url = uri('https://maven.thorfusion.com/artifactory/thorfusion/')
        content { includeGroup 'mekanism' }
    }
    maven {
        name = 'Thorfusion Development'
        url = uri('https://maven.thorfusion.com/artifactory/dev/')
        content { includeGroup 'mekanism' }
    }
}

dependencies {
    compileOnly "org.jetbrains:annotations:${jb_annotations}"
    testImplementation 'junit:junit:4.13.2'

    implementation rfg.deobf("MCMultiPart2:MCMultiPart:${mcmp_version}")
    compileOnly "mezz.jei:jei_${minecraft_version}:${jei_version}:api"
    compileOnly "net.darkhax.tesla:Tesla-${minecraft_version}:${tesla_version}"
    compileOnly "li.cil.oc:OpenComputers:MC${minecraft_version}-${opencomputers_version}:api"
    compileOnly "mcp.mobius.waila:Hwyla:${hwyla_version}:api"
    compileOnly "com.mod-buildcraft:buildcraft-api:${buildcraft_version}"
    compileOnly "team.chisel.ctm:CTM:MC${minecraft_version}-${ctm_version}:api"
    compileOnly "net.industrial-craft:industrialcraft-2:${ic2_version}:api"
    compileOnly("CraftTweaker2:CraftTweaker2-API:${crafttweaker_version}") {
        exclude module: 'asm-debug-all'
    }
    implementation(rfg.deobf("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${crafttweaker_version}")) {
        exclude module: 'asm-debug-all'
    }
    compileOnly "dan200.computercraft:ComputerCraft:${computercraft_version}:api"
    compileOnly "mcjty.theoneprobe:TheOneProbe-1.12:${top_version}:api"

    // Optional integrations whose API jars are deliberately checked into libs/.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

// Core machine enums reference optional API types during class initialization.
// Keep them compile-only for shipped artifacts, but present while integration
// tests exercise the real recipe registries.
configurations.testRuntimeClasspath.extendsFrom(configurations.compileOnly)

minecraft {
    mcVersion.set(minecraft_version)
    mcpMappingChannel.set(mappings_version.split('_')[0])
    mcpMappingVersion.set(mappings_version.split('_')[1])
    useDependencyAccessTransformers.set(true)

    injectedTags.put('${version}', mod_version)
    tagReplacementFiles.add('Mekanism.java')
}

tasks.named('deobfuscateMergedJarToSrg') {
    accessTransformerFiles.from('src/main/resources/mekanism_at.cfg')
}

tasks.named('srgifyBinpatchedJar') {
    accessTransformerFiles.from('src/main/resources/mekanism_at.cfg')
}

tasks.named('processResources') {
    inputs.property 'version', mod_version
    inputs.property 'mc_version', minecraft_version
    filesMatching('mcmod.info') {
        expand 'version': mod_version, 'mc_version': minecraft_version
    }
    exclude '**/*.blend*'
    rename '(.+_at.cfg)', 'META-INF/$1'
}

def setMainManifestProps = { Manifest manifest ->
    manifest.attributes(
            'FMLAT': 'mekanism_at.cfg',
            'FMLCorePluginContainsFMLMod': 'true',
            'FMLCorePlugin': 'mekanism.coremod.MekanismCoremod')
}

tasks.named('jar') {
    manifest(setMainManifestProps)
}

def artifactOutputDir = layout.projectDirectory.dir('output')
def reobfuscatedJar = tasks.named('reobfJar', ReobfuscatedJar)
def reobfuscatedContents = {
    zipTree(reobfuscatedJar.get().archiveFile.get().asFile)
}

tasks.register('coreJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('Core')
    destinationDirectory.set(artifactOutputDir)
    from('etc/core') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'mcmp_version': mcmp_version
    }
    from(reobfuscatedContents) {
        exclude 'mekanism/tools/**', 'mekanism/generators/**', 'mekanism/ultimate/**', 'mekanism/nuclear/**',
                'mekanism/mekasuit/**',
                'assets/mekanismtools/**', 'assets/mekanismgenerators/**',
                'assets/mekanismultimate/**', 'assets/mekanismnuclear/**',
                'assets/mekanismmekasuit/**', 'mcmod.info'
    }
    manifest(setMainManifestProps)
}

tasks.register('alltJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('ALL')
    destinationDirectory.set(artifactOutputDir)
    from('etc/all') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'mcmp_version': mcmp_version
    }
    from(reobfuscatedContents) {
        exclude 'mcmod.info'
    }
    manifest(setMainManifestProps)
}

tasks.register('toolsJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('Tools')
    destinationDirectory.set(artifactOutputDir)
    from('etc/tools') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'mcmp_version': mcmp_version
    }
    from(reobfuscatedContents) {
        include 'mekanism/tools/**', 'assets/mekanismtools/**'
    }
}

tasks.register('generatorsJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('Generators')
    destinationDirectory.set(artifactOutputDir)
    from('etc/generators') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'mcmp_version': mcmp_version
    }
    from(reobfuscatedContents) {
        include 'mekanism/generators/**', 'assets/mekanismgenerators/**'
    }
}

tasks.register('ultimateJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('Ultimate')
    destinationDirectory.set(artifactOutputDir)
    from('etc/ultimate') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'mcmp_version': mcmp_version
    }
    from(reobfuscatedContents) {
        include 'mekanism/ultimate/**', 'assets/mekanismultimate/**'
    }
}

tasks.register('nuclearJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('Nuclear')
    destinationDirectory.set(artifactOutputDir)
    from('etc/nuclear') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version
    }
    from(reobfuscatedContents) {
        include 'mekanism/nuclear/**', 'assets/mekanismnuclear/**'
    }
}

tasks.register('mekasuitJar', Jar) {
    dependsOn reobfuscatedJar
    archiveClassifier.set('MekaSuit')
    destinationDirectory.set(artifactOutputDir)
    from('etc/mekasuit') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version
    }
    from(reobfuscatedContents) {
        include 'mekanism/mekasuit/**', 'assets/mekanismmekasuit/**'
    }
}

tasks.register('apiJar', Jar) {
    dependsOn tasks.named('classes')
    archiveClassifier.set('API')
    destinationDirectory.set(artifactOutputDir)
    from sourceSets.main.java.srcDirs
    from sourceSets.main.output
    include 'mekanism/api/**'
}

def distributionArtifacts = [
        tasks.named('toolsJar'),
        tasks.named('coreJar'),
        tasks.named('generatorsJar'),
        tasks.named('alltJar'),
        tasks.named('apiJar'),
        tasks.named('ultimateJar'),
        tasks.named('nuclearJar'),
        tasks.named('mekasuitJar')
]

tasks.register('fullBuild') {
    group = 'build'
    description = 'Builds every distribution artifact.'
    dependsOn distributionArtifacts
}

def publishBaseUrl = providers.environmentVariable('MAVEN_URL')
        .orElse('https://maven.thorfusion.com/artifactory')
def publishRepository = providers.environmentVariable('MAVEN_REPO').orElse('dev')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'Mekanism-Community-Edition'
            groupId = project.group
            version = project.version
            distributionArtifacts.each { artifact it }
            pom {
                name.set('Mekanism Community Edition')
                description.set('Mekanism is a Minecraft add-on featuring high-tech machinery that can be used to create powerful tools, armor, and weapons.')
                url.set('https://github.com/Thorfusion/Mekanism-Community-Edition')
                issueManagement {
                    system.set('github')
                    url.set('https://github.com/Thorfusion/Mekanism-Community-Edition/issues')
                }
                licenses {
                    license {
                        name.set('EUPL-1.2')
                        distribution.set('repo')
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'thorfusion'
            url = uri("${publishBaseUrl.get().replaceAll('/+$', '')}/${publishRepository.get()}")
            credentials {
                username = providers.environmentVariable('MAVEN_USERNAME').orElse('').get()
                password = providers.environmentVariable('MAVEN_PASSWORD').orElse('').get()
            }
        }
    }
}

tasks.register('artifactoryPublish') {
    group = 'publishing'
    description = 'Publishes the complete artifact set to the configured Maven repository.'
    dependsOn tasks.named('publishMavenJavaPublicationToThorfusionRepository')
}
